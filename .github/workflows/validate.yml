name: Validate thread definitions

on:
  push:
    paths:
      - 'threads/**'
      - 'experimental/**'
      - 'recipes/**'
      - 'tools/**'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'threads/**'
      - 'experimental/**'
      - 'recipes/**'
      - 'tools/**'
  workflow_dispatch:

jobs:
  validate:
    name: Check XML thread files
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate
        run: python tools/validate_threads.py threads

      # threads/*.xml wird aus recipes/*.toml erzeugt. Weicht es ab, hat jemand
      # die XML von Hand angefasst - genau so entstehen Werte, die nicht mehr
      # zueinander passen (siehe PCO 1881 in v1.0.0).
      - name: Threads match their recipes
        run: |
          mkdir -p /tmp/regen
          for f in recipes/*.toml; do
            python tools/build_thread.py "$f" -o /tmp/regen/
          done
          if ! diff -r --brief threads /tmp/regen; then
            echo "::error::threads/ weicht von recipes/ ab."
            echo "Bitte 'python tools/build_thread.py recipes/<datei>.toml -o threads/' laufen lassen,"
            echo "statt die XML von Hand zu bearbeiten."
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### Thread validation"
            echo ""
            echo "| File | Sizes | SortOrder | Angle |"
            echo "|------|------:|----------:|------:|"
            python - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          for p in sorted(glob.glob("threads/*.xml")):
              r = ET.parse(p).getroot()
              n = len(r.findall(".//Designation"))
              print(f"| `{os.path.basename(p)}` | {n} | "
                    f"{r.findtext('SortOrder')} | {r.findtext('Angle')}° |")
          PY
          } >> "$GITHUB_STEP_SUMMARY"
